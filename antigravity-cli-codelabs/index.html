<!doctype html>

<html>
<head>
  <meta name="viewport" content="width=device-width, minimum-scale=1.0, initial-scale=1.0, user-scalable=yes">
  <meta name="theme-color" content="#4F7DC9">
  <meta charset="UTF-8">
  <title>Taller Práctico: Dominando Antigravity CLI</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Code+Pro:400|Roboto:400,300,400italic,500,700|Roboto+Mono">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <style>
    :root {
      color-scheme: light;
      --primary-color: #1a73e8;
      --hover-color: #1557b0;
      --bg-color: #f8fafd;
      --text-color: #202124;
      --muted-text: #5f6368;
      --border-color: #dadce0;
      --shadow-color: rgba(60, 64, 67, 0.08);
      font-family: 'Google Sans', Roboto, Arial, sans-serif;
    }
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      background: var(--bg-color);
      color: var(--text-color);
      overflow: hidden;
    }
    .module-tabs {
      align-items: center;
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      box-shadow: 0 4px 20px var(--shadow-color);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      min-height: 70px;
      justify-content: center;
      padding: 0 24px;
      position: relative;
      z-index: 10;
    }
    .module-tab {
      border: 1px solid var(--border-color);
      border-radius: 24px;
      background: #ffffff;
      color: var(--muted-text);
      cursor: pointer;
      font: 500 14px/1.4 'Google Sans', Roboto, Arial, sans-serif;
      min-width: 160px;
      padding: 10px 20px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }
    .module-tab:hover {
      background: var(--bg-color);
      color: var(--primary-color);
      border-color: var(--primary-color);
      transform: translateY(-1px);
      box-shadow: 0 4px 8px var(--shadow-color);
    }
    .module-tab.active {
      background: var(--primary-color);
      border-color: var(--primary-color);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(26, 115, 232, 0.3);
      transform: scale(1.02);
    }
    .module-tab.active:hover {
      background: var(--hover-color);
      border-color: var(--hover-color);
      color: #ffffff;
    }
    .module-frame {
      border: 0;
      display: block;
      height: calc(100vh - 71px);
      width: 100%;
      background: #ffffff;
      transition: opacity 0.15s ease-in-out;
    }
    @media (max-width: 680px) {
      .module-tabs {
        align-items: stretch;
        padding: 12px;
        gap: 8px;
      }
      .module-tab {
        flex: 1 1 100%;
        min-width: 0;
      }
      .module-frame {
        height: calc(100vh - 180px);
      }
    }
  </style>
</head>
<body>
  <nav class="module-tabs" aria-label="Seleccionar módulo">
    <button class="module-tab active" type="button" data-src="cli.html" aria-selected="true">Antigravity CLI</button>
    <button class="module-tab" type="button" data-src="antigravity-20.html" aria-selected="false">Antigravity 2.0</button>
    <button class="module-tab" type="button" data-src="advanced-topics.html" aria-selected="false">Temas Avanzados</button>
  </nav>
  <iframe class="module-frame" title="Codelab seleccionado" src="cli.html"></iframe>

  <script>
    const frame = document.querySelector('.module-frame');
    const tabs = document.querySelectorAll('.module-tab');

    tabs.forEach((tab) => {
      tab.addEventListener('click', () => {
        tabs.forEach((item) => {
          const active = item === tab;
          item.classList.toggle('active', active);
          item.setAttribute('aria-selected', String(active));
        });
        frame.src = tab.dataset.src;
      });
    });
  </script>
</body>
</html>
